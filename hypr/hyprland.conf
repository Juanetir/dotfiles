monitor=,preferred,auto,1

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/animation.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.cache/palette.conf


input {
    kb_layout = fr
    kb_variant = oss
}

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 10
}

device {
    name = syna2ba6:00-06cb:cfd8-touchpad
    natural_scroll = true
}


decoration {
    active_opacity = 1
    inactive_opacity = 0.9

    rounding = $borderRadius

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

general { 
    col.active_border = $borderColor
    col.inactive_border = $buttonsColor 
}

