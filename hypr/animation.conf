animations {
    enabled = true

    bezier = smooth, 0.16, 1, 0.3, 1
    bezier = snappy, 0.2, 0.8, 0.2, 1

    animation = windows, 1, 4, smooth
    animation = workspaces, 1, 6, smooth
    animation = layers, 1, 3, snappy
}


# Layer animations
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = animation slide down, match:namespace wallpaperSelector
layerrule = animation slide right, match:namespace control-center