exec-once = sh -c 'while true; do waybar; sleep 1; done'
exec-once = swaync


##* Now AWWW
# exec-once = hyprpaper
# exec-once = sh -c 'sleep 0.2; wallpaper=$(cat ~/.cache/current-wallpaper); hyprctl hyprpaper wallpaper "eDP-1,$wallpaper"'
exec-once = awww-daemon
exec-once = hypridle

exec-once = aerion --dbus-notify
exec-once = python3 ~/dotfiles/scripts/super-double.py
exec-once = ~/dotfiles/scripts/battery-notification.sh

## WINDOWS TILING ##
windowrule = match:class .*, suppress_event maximize

## KDE CONNECT##
exec-once = kdeconnectd
exec-once = kdeconnect-indicator

## COPY & PASTE ##
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist storew

## TOGGLE ENABLED TOUCHPAD ON START ##
exec-once = echo 1 > ~/.cache/touchpad.state
exec-once = hyprctl keyword "device[syna2ba6:00-06cb:cfd8-touchpad]:enabled" true

## WIDGETS STARTS ##
exec-once = quickshell -c ~/dotfiles/quickshell/wallpaper
exec-once = quickshell -c ~/dotfiles/quickshell/control-center
exec-once = quickshell -c ~/dotfiles/quickshell/screenshots

## CURSOR ##
env = XCURSOR_THEME,$CursorTheme
env = XCURSOR_SIZE, $CursorSize
