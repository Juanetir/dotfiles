background {
    monitor =
    path = /home/tunic/dotfiles/wallpapers/Messy-Room.jpg
    blur_passes = 0
    blur_size = 0
}
label {
    monitor =
    text = $TIME
    font_size = 240
    font_family = Playpen Sans

    color = rgba(0, 0, 0, 0.7)

    position = 0, 176
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_size = 242
    font_family = Playpen Sans

    color = rgba(255, 255, 255, 1.0)

    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = __BATTERY__%
    font_size = 14
    font_family = Playpen Sans

    color = rgba(255, 255, 255, 0.9)

    position = -20, -20
    halign = right
    valign = top
}

input-field {
    size = 300, 50

    position = 0, -100
    halign = center
    valign = center

    outline_thickness = 5
    rounding = 22

    inner_color = rgba(34, 37, 52, 0.9)
    outer_color = rgba(255, 255, 255, 0.6)

    font_color = rgba(255, 255, 255, 0.9)

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    fade_on_empty = false
    placeholder_text = Enter password...
}

animations {
    enabled = true

    animation = inputFieldDots, 1, 2, default
    animation = inputFieldFade, 1, 2, default
    animation = inputFieldWidth, 1, 2, default
    animation = inputFieldColors, 1, 2, default
}
