bind = SUPER, Q, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, R, exec, $appFinder
bind = SUPER, M, exec, $mailManager
bind = SUPER, W, exec, $browser
bind = SUPER, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy

## CONTROl ##

bind = CTRL SHIFT, W, killactive
bind = $mainMod, F, fullscreen

#Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#volume & brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && pkill -SIGRTMIN+8 waybar
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && pkill -SIGRTMIN+8 waybar
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && pkill -SIGRTMIN+8 waybar
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# SUPER MODE #


# Workspaces

bind = $mainMod, RIGHT, exec,~/dotfiles/scripts/workspace-next.sh
bind = $mainMod, LEFT, exec, ~/dotfiles/scripts/workspace-prev.sh

bind = $mainMod SHIFT, LEFT, movetoworkspace, e-1
bind = $mainMod SHIFT, RIGHT, movetoworkspace, e+1


## DESACTIVATE TOUCHPAD ##
bind = SUPER, T, exec, ~/dotfiles/scripts/toggle-touchpad.sh
